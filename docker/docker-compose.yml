name: pidb

x-image: &image
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: pidb-server:local

services:
  server:
    <<: *image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PIDB_MASTER_KEY_FILE: /run/secrets/master_key
      PIDB_DATA_DIR: /data
      PIDB_PORT: "8080"
      PIDB_TRUST_PROXY: "true"
    secrets:
      - master_key
    volumes:
      - pidb-data:/data
    # Never publish ports for this service: PIDB_TRUST_PROXY=true above is only
    # safe because Caddy is the sole way in.
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      PIDB_DOMAIN: ${PIDB_DOMAIN}
      PIDB_ACME_EMAIL: ${PIDB_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    <<: *image
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PIDB_MASTER_KEY_FILE: /run/secrets/master_key
      PIDB_DATA_DIR: /data
    secrets:
      - master_key
    volumes:
      - pidb-data:/data
    entrypoint: ["/bin/sh", "/app/docker/backup-loop.sh"]
    healthcheck:
      disable: true

volumes:
  pidb-data:
  caddy-data:
  caddy-config:

secrets:
  # Mounted read-only at /run/secrets/master_key. The container runs as uid 1000 (node):
  # on the host run `chmod 600 secrets/master_key && sudo chown 1000:1000 secrets/master_key`.
  master_key:
    file: ./secrets/master_key
